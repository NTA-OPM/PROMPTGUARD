[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "promptguard-oss"
version = "0.1.0.dev0"
description = "Open-source, privacy-first prompt-injection detection, policy and evaluation toolkit (defense-in-depth; no prevention guarantee)."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
keywords = ["llm", "security", "prompt-injection", "guardrails", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["pydantic>=2.6,<3", "pyyaml>=6,<7", "typer>=0.12,<1"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
model = ["transformers>=4.40", "torch>=2.2"]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "ruff>=0.5", "mypy>=1.10",
       "httpx>=0.27", "pytest-asyncio>=0.23", "fastapi>=0.110", "uvicorn>=0.29", "types-PyYAML", "pip-audit>=2.7"]

[project.scripts]
promptguard = "promptguard.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/promptguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S311", "E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]
"datasets/**" = ["S", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/promptguard"]
